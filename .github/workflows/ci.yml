name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Generated files are fresh
        run: |
          go generate ./...
          if ! git diff --exit-code; then
            echo "Generated files are stale. Run 'go generate ./...' and commit the result." >&2
            exit 1
          fi

      - name: Test (race detector)
        run: go test -race ./...

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: gofmt check
        run: |
          fmt_out="$(gofmt -l .)"
          if [ -n "$fmt_out" ]; then
            echo "The following files are not gofmt-formatted:" >&2
            echo "$fmt_out" >&2
            echo "Run 'gofmt -w .' locally and commit the result." >&2
            exit 1
          fi

      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.7.0 ./...

      # Version pinned; Dependabot bumps it.
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

  fuzz-smoke:
    name: fuzz-smoke
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Discover and run fuzz targets (10s each)
        run: |
          set -euo pipefail
          found_any=0
          for pkg in $(go list ./...); do
            targets="$(go test -list '^Fuzz[A-Za-z0-9_]*$' "$pkg" 2>/dev/null | grep -E '^Fuzz[A-Za-z0-9_]*$' || true)"
            if [ -z "$targets" ]; then
              continue
            fi
            while IFS= read -r target; do
              [ -z "$target" ] && continue
              found_any=1
              echo "::group::Fuzz $target ($pkg)"
              go test -run '^$' -fuzz "^${target}$" -fuzztime 10s "$pkg"
              echo "::endgroup::"
            done <<< "$targets"
          done
          if [ "$found_any" -eq 0 ]; then
            echo "No fuzz targets found in any package; nothing to run."
          fi

  bench-compile:
    name: bench-compile
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Compile and run benchmarks once
        run: go test -run '^$' -bench . -benchtime 1x ./...

      - name: Check streaming performance budgets
        run: make bench-ci

      - name: Upload benchmark report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmark-${{ runner.os }}-${{ runner.arch }}
          path: benchmark-ci.json

  licence-check:
    name: licence-check
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify THIRD_PARTY.md and scan for unrecorded third-party headers
        run: |
          set -euo pipefail

          if [ ! -f THIRD_PARTY.md ]; then
            echo "THIRD_PARTY.md is missing. Every repository must carry a" >&2
            echo "third-party provenance register, even when empty." >&2
            exit 1
          fi

          # Look for copyright headers that are not attributed to Last Person
          # Labs, outside of LICENSE/THIRD_PARTY.md and CI config itself
          # (this check documents the pattern it looks for, which would
          # otherwise self-match).
          matches="$(grep -rIn \
            --exclude-dir=.git \
            --exclude-dir=.github \
            --exclude=LICENSE \
            --exclude=THIRD_PARTY.md \
            "Copyright" . | grep -v "Last Person Labs" || true)"

          if [ -n "$matches" ]; then
            echo "Found copyright headers not attributed to Last Person Labs:" >&2
            echo "$matches" >&2
            echo >&2
            echo "If this is vendored or adapted third-party code, record its" >&2
            echo "provenance (source URL, commit, licence, local path) in" >&2
            echo "THIRD_PARTY.md before merging." >&2
            exit 1
          fi

          echo "No unrecorded third-party copyright headers found."
